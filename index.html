<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-R6kjt5FwTd5vAw94Q08NLDZsSaGTzg4NsdIfKtECSp0=' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com https://www.google.com https://fonts.gstatic.com; connect-src 'self' https://sirbai-api.mahmoudmomajeed.workers.dev https://sirbai-api2.7oka12345678910.workers.dev https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com; frame-src https://translate.google.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التحكم · Sirb_Ai</title>
  <link rel="icon" type="image/png" sizes="512x512" href="img/fav.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="core.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="app">
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17M9 9v11.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m14 7 5 5-5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.7"/><path d="M20 4v4.7h-4.7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4.5h4.5v15H14"/><path d="M10 8l-4 4 4 4M6 12h9"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></symbol>
  </svg>
  <div class="shell" id="shell" hidden>
    <header class="bar">
      <span class="bar-logo" aria-hidden="true"><img src="img/fav.png" alt=""></span>
      <div class="who"><svg class="ic"><use href="#i-panel"/></svg><div class="who-text"><strong>لوحة التحكم</strong><span class="en" id="who" dir="ltr"></span></div></div>
      <div class="bar-end">
        <button type="button" class="icon-btn" id="admOut" aria-label="خروج من لوحة التحكم" title="خروج"><svg class="ic"><use href="#i-out"/></svg></button>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="تبديل الوضع"><svg class="ic sun"><use href="#i-sun"/></svg><svg class="ic moon"><use href="#i-moon"/></svg></button>
      </div>
    </header>
    <nav class="tabs-bar" id="tabs" role="tablist"></nav>
    <main class="frame" id="view"></main>
  </div>
  <div class="gate" id="gate"><span class="sk-line"></span><p class="hint" id="gateMsg">جارٍ التحقق من صلاحياتك...</p></div>
  <section class="adm-login" id="login" hidden>
    <form class="card adm-card" id="loginForm" novalidate>
      <img class="adm-logo" src="img/fav.png" alt="">
      <h1><svg class="ic"><use href="#i-lock"/></svg>دخول لوحة التحكم</h1>
      <p class="hint">للإدارة فقط</p>
      <label class="adm-f"><span>اسم المستخدم</span><input id="admUser" type="text" autocomplete="username" maxlength="100" dir="auto" required></label>
      <label class="adm-f"><span>كلمة السر</span><input id="admPass" type="password" autocomplete="current-password" maxlength="200" required></label>
      <p class="msg" id="loginMsg"></p>
      <button type="submit" class="btn" id="loginBtn"><svg class="ic"><use href="#i-lock"/></svg>دخول</button>
    </form>
  </section>

  <dialog class="modal wide" id="editDlg">
    <div class="modal-head"><svg class="ic"><use href="#i-panel"/></svg><h2 id="editTitle">تعديل</h2><button type="button" class="icon-btn modal-x" data-close aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <form id="editForm" class="edit-form" novalidate></form>
    <p class="msg" id="editMsg"></p>
    <div class="dlg-acts">
      <button type="button" class="btn" id="editSave"><svg class="ic"><use href="#i-check"/></svg>حفظ</button>
      <button type="button" class="btn ghost danger" id="editDel"><svg class="ic"><use href="#i-x"/></svg>حذف</button>
    </div>
  </dialog>

  <dialog class="modal" id="passDlg">
    <div class="modal-head"><svg class="ic"><use href="#i-lock"/></svg><h2 id="passTitle">تأكيد كلمة سر اللوحة</h2><button type="button" class="icon-btn modal-x" data-pclose aria-label="إغلاق"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <form id="passForm" class="pass-form" novalidate>
      <p class="section-note" id="passNote"></p>
      <label class="adm-f"><span>كلمة سر اللوحة (ورقة ss الخانة B1)</span><input id="passIn" type="password" autocomplete="current-password" maxlength="200"></label>
      <label class="adm-f" id="confirmWrap" hidden><span id="confirmLbl"></span><input id="confirmIn" type="text" dir="ltr" autocomplete="off" maxlength="20"></label>
      <p class="msg" id="passMsg"></p>
      <div class="dlg-acts"><button type="submit" class="btn" id="passOk"><svg class="ic"><use href="#i-check"/></svg>تأكيد</button><button type="button" class="btn ghost" data-pclose>إلغاء</button></div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="lang.js"></script>
  <script src="panel.js"></script>
</body>
</html>
